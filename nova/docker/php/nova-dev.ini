; Nova development overrides (on top of php.ini-development).

; Times are stored in UTC and displayed in Asia/Tehran by the application (05 §2).
date.timezone = UTC

default_charset = UTF-8
expose_php = Off

error_reporting = E_ALL
display_errors = On
display_startup_errors = On
log_errors = On

; Headroom for media processing, publishing and backups inside one request.
; Host capability needs, not performance targets (D14/D17).
memory_limit = 512M
max_execution_time = 120
upload_max_filesize = 64M
post_max_size = 72M

; OPcache on, and revalidating every request so edited files apply at once.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
