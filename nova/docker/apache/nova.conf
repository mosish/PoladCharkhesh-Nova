# Nova development virtual host.

ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    ServerName nova.localhost
    ServerAlias localhost

    DocumentRoot /var/www/nova/public_html

    # Deliberately as permissive as a typical shared host (directory listing
    # on, all overrides allowed): Nova's own .htaccess must lock things down.
    <Directory /var/www/nova/public_html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Development-only diagnostics. Lives outside the docroot and is never deployed.
    Alias /_dev /var/www/nova/docker/dev-www
    <Directory /var/www/nova/docker/dev-www>
        Options -Indexes
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

# Development-only view of the live release (strategy S: _site/current), one host per language as in
# production (.ir → fa, .com → en, D6). Production routing is the generated .htaccess (step 13).
<VirtualHost *:80>
    ServerName fa.nova.localhost
    DocumentRoot /var/www/nova/public_html/_site/current/fa
    Alias /assets /var/www/nova/public_html/assets
    Alias /data /var/www/nova/public_html/_site/current/data
    ErrorDocument 404 /404.html
    <Directory /var/www/nova/public_html>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:80>
    ServerName en.nova.localhost
    DocumentRoot /var/www/nova/public_html/_site/current/en
    Alias /assets /var/www/nova/public_html/assets
    Alias /data /var/www/nova/public_html/_site/current/data
    ErrorDocument 404 /404.html
    <Directory /var/www/nova/public_html>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
